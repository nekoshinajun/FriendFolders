name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build native installer
        run: dotnet publish installer/FriendFoldersSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FriendFolders-Setup
          path: publish/FriendFolders-Setup.exe
      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/FriendFolders-Setup.exe
