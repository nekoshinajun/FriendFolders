name: Build Windows Installer (signed-release preparation)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build native installer
        run: dotnet publish installer/FriendFoldersSetup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: FriendFolders-Setup-UNSIGNED-TEST-ONLY
          path: publish/FriendFolders-Setup.exe
